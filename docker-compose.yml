version: "3.9"

services:
  gateway:
    image: ghcr.io/siwatinc/ssh-mosh-wan-optimizer:latest
    # Or build locally:
    # build: .
    restart: unless-stopped
    ports:
      - "2222:2222"             # SSH listen port
    volumes:
      - ./keys:/keys:ro         # Mount your authorized_keys here
      - gateway-hostkey:/etc/gateway  # Persist the generated server host key
    environment:
      # ── Fixed remote target ────────────────────────────────────────
      # This is the ONLY host clients can reach through this gateway.
      # Dynamic routing is disabled.
      REMOTE_HOST: "my-remote-server.example.com"   # required
      REMOTE_PORT: "22"

      # ── Client → Gateway auth ──────────────────────────────────────
      # Leave unset to delegate auth to the remote server (zero-config):
      # the client's forwarded agent must satisfy the remote's authorized_keys.
      #
      # Set to pre-screen clients before they reach the remote:
      # GATEWAY_AUTHORIZED_KEYS_PATH: "/keys/authorized_keys"
      # GATEWAY_AUTHORIZED_KEYS_CONTENT: "ssh-ed25519 AAAA... user@host"
      #
      # Password auth (optional)
      # GATEWAY_PASSWORD_AUTH: "true"
      # GATEWAY_PASSWORDS: "alice:s3cr3t,bob:p4ss"

      GATEWAY_HOST_KEY_PATH: "/etc/gateway/host_key"

      # ── Gateway → Remote auth ─────────────────────────────────────
      # Place the gateway's private key in ./keys/id_ed25519
      # (public key must be in authorized_keys on the remote server)
      GATEWAY_SSH_KEY_PATH: "/keys/id_ed25519"
      # GATEWAY_SSH_KEY_CONTENT: "<base64-encoded-private-key>"  # alternative

      # Remote host-key verification:
      # REMOTE_KNOWN_HOSTS: "/keys/known_hosts"   # recommended in production
      # REMOTE_IGNORE_HOST_KEY: "true"            # insecure — dev only

volumes:
  gateway-hostkey:
